<div class="sign-up-wrapper" appFocusTrapDirective>
  <h2 class="title">{{'sign-up' | transloco}}</h2>

  <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()">
    <div class="form-field">
      <label for="name">{{'user-name' | transloco}}</label>
      <input
        #firstInput
        id="name"
        formControlName="name"
        placeholder="{{'placeholder-name' | transloco}}"
        type="text"
      />
    </div>
    <div class="form-field">
      <label for="email">{{'user-email' | transloco}}</label>
      <input id="email" formControlName="email" placeholder="{{'placeholder-email' | transloco}}" type="email" />
    </div>
    <div class="form-field">
      <label for="password">{{'user-password' | transloco}}</label>
      <input
        id="password"
        formControlName="password"
        placeholder="{{'placeholder-password' | transloco}}"
        [type]="passwordVisible() ? 'text' : 'password'"
        autocomplete="off"
      />
      <button
        tabindex="-1"
        type="button"
        class="toggle-password"
        [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
        (click)="passwordVisible.set(!passwordVisible())"
      >
        <span class="material-icons">{{
          passwordVisible() ? 'visibility' : 'visibility_off'
        }}</span>
      </button>
    </div>
    <div class="form-field">
      <label for="confirm-password">{{'user-confirm-password' | transloco}}</label>
      <input
        id="confirm-password"
        formControlName="confirmPassword"
        placeholder="{{'placeholder-confirm-password' | transloco}}"
        autocomplete="off"
        [type]="confirmPasswordVisible() ? 'text' : 'password'"
      />
      <button
        tabindex="-1"
        type="button"
        class="toggle-password"
        [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
        (click)="confirmPasswordVisible.set(!passwordVisible())"
      >
        <span class="material-icons">{{
          confirmPasswordVisible() ? 'visibility' : 'visibility_off'
        }}</span>
      </button>
    </div>
    <button type="submit" class="button-accent button-auth">{{'sign-up' | transloco}}</button>
  </form>
</div>
