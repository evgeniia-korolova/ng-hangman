<div class="actions-container">
  <div class="select-wrapper">
    <app-custom-select
      [label]="hangmanService.currentCategoryData()?.title"
      [options]="hangmanService.categoryList()"
      [selected]="hangmanService.currentCategory()"
      (selectOption)="onCategoryChange($event)"
    />
  </div>

  <div class="stastics">
    @if (authService.isRegistered() && authService.isAuthenticated()) {
      <div class="stat-field">
        <div>Total:</div>
        <div>{{ authService.currentUser()?.stats?.games }}</div>
      </div>
      <div class="stat-field">
        <div>Wins:</div>
        <div>{{ authService.currentUser()?.stats?.wins }}</div>
      </div>
      <div class="stat-field">
        <div>Losses:</div>
        <div>{{ authService.currentUser()?.stats?.losses }}</div>
      </div>
    }
  </div>
</div>
