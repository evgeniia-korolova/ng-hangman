<div class="game">
  <app-hangman-display
    class="hagman-display"
    [currentQuizz]="currentQuizz()"
    [guesses]="guesses()"
    [mistakesRemaining]="mistakesRemaining()"
    [success]="success()"
  />
  <div class="content">
    <div class="hangman-body">
      <app-question [currentQuizz]="currentQuizz()" [characters]="characters()" />
      <app-keyboard
        [keyboardChar]="keyboardCharacters()"
        [rows]="rows()"
        (keyPressed)="onKeyPressed($event)"
      />
    </div>
    @if (isGameOver()) {
      <div class="overlay">
        <app-game-over-screen
          [success]="success()"
          [currentQuizz]="currentQuizz()"
          (startNewGame)="restartGame()"
        />
      </div>
    }
  </div>
  <app-actions class="actions" />
</div>
