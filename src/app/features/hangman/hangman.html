<div class="game">
  <app-hangman-display
    [currentQuizz]="currentQuizz()"
    [guesses]="guesses()"
    [mistakesRemaining]="mistakesRemaining()"
    [success]="success()"
  />
  <div class="content">
    @if (!isGameOver()) {
      <app-question [currentQuizz]="currentQuizz()" [characters]="characters()" />
      <app-keyboard [keyboardChar]="keyboardCharacters()" (keyPressed)="onKeyPressed($event)" />
    } @else {
      <app-game-over-screen [success]="success()" [currentQuizz]="currentQuizz()" (startNewGame)="restartGame()" />
    }
  </div> 
  <app-actions />
</div>
