<div class="game">
  <app-hangman-display
    [currentQuizz]="currentQuizz()"
    [guesses]="guesses()"
    [mistakesRemaining]="mistakesRemaining()"
    [success]="success()"
  />
  <div class="content">
    <app-question [currentQuizz]="currentQuizz()" [characters]="characters()" />
    <app-keyboard [keyboardChar]="keyboardCharacters()" (keyPressed)="onKeyPressed($event)" />
  </div>
  <app-actions class="actions" />
</div>
