<div class="keyboard">
  <div class="keys" [class]="langService.currentLanguage()">
    @for (row of rows(); track $index; let rowIndex = $index) {
      <div class="row">
        @for (key of row; track key.value; let colIndex = $index) {
          <button
            #keyBtn
            [class.btn-disabled]="key.disabled"
            [disabled]="key.disabled"
            aria-disabled="{{ key.disabled }}"
            (click)="onKeyClick(key.value)"
            (keydown)="onKeyDown($event, rowIndex, colIndex)"
          >
            <span>{{ key.value | uppercase }}</span>
          </button>
        }
      </div>
    }
  </div>
</div>
