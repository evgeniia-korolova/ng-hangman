<div
  class="switcher"
  (appClickOutside)="isOpen.set(false)"
  (keydown.enter)="isOpen.set(false)"
  (keydown.space)="isOpen.set(false)"
  tabindex="-1"
>
  <button
    type="button"
    class="trigger"
    (click)="toggle()"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen()"
    aria-controls="lang-dropdown"
  >
    <span>{{ currentLanguage() | transloco }}</span>
    <span class="material-symbols-outlined arrow" [class.open]="isOpen()">expand_more</span>
  </button>

  @if (isOpen()) {
    <ul
      id="lang-dropdown"
      class="dropdown"
      role="listbox"
      [attr.aria-activedescendant]="currentLanguage()"
    >
      @for (lang of languages(); track lang) {
        <li
          id="{{ lang }}"
          class="option"
          role="option"
          [class.active]="lang === currentLanguage()"
          (click)="select(lang)"
          (keydown.enter)="select(lang)"
          (keydown.space)="select(lang)"
          tabindex="0"
          [attr.aria-selected]="lang === currentLanguage()"
        >
          {{ lang | transloco }}
        </li>
      }
    </ul>
  }
</div>
